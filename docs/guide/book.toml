[book]
title = "Sigillr"
description = "A public identity registry: bind your keys to a pseudonymous user_id and let anyone verify them"
authors = ["The Sigillr Authors"]
language = "en"
src = "."

[build]
build-dir = "../../target/book"

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["theme/brand.css"]
git-repository-url = "https://github.com/startr-trade/sigillr"
edit-url-template = "https://github.com/startr-trade/sigillr/edit/main/docs/guide/{path}"
site-url = "/sigillr/"

[output.html.search]
enable = true
