name: CodeQL

# Static analysis of the Rust code, once per release: on the release branch, so its result exists
# for the release's main stage; and on demand.
on:
  workflow_dispatch:
  push:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # `build-mode: none` extracts from source: no build is needed to analyse Rust.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: sast
