name: Docs

# Builds the mdBook under docs/guide and publishes it to GitHub Pages.
#
# One-time repo setup before the first successful deploy:
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Without that, actions/deploy-pages fails with "Pages site not found".

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time, and never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned so a book that builds locally builds identically here.
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    name: mdBook build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install mdBook
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/rust-lang/mdBook/releases/download"
          curl -fsSL --proto '=https' --proto-redir '=https' \
            "${base}/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build docs/guide

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # build-dir in book.toml is ../../target/book, relative to docs/guide.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
